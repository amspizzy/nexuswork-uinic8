<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 600" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <filter id="cloudSoftShadow" x="-20%" y="-10%" width="140%" height="120%">
      <feDropShadow dx="-4" dy="0" stdDeviation="6" flood-color="#0245a3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Layer 1: Semi-transparent blue cloud puffs (Back layer) -->
  <g fill="rgba(255, 255, 255, 0.22)">
    <circle cx="20" cy="50" r="42" />
    <circle cx="28" cy="130" r="38" />
    <circle cx="15" cy="210" r="45" />
    <circle cx="24" cy="290" r="40" />
    <circle cx="16" cy="370" r="44" />
    <circle cx="26" cy="450" r="39" />
    <circle cx="18" cy="530" r="43" />
    <circle cx="22" cy="590" r="36" />
  </g>

  <!-- Layer 2: Medium opacity cloud puffs (Middle layer) -->
  <g fill="rgba(255, 255, 255, 0.45)">
    <circle cx="42" cy="40" r="36" />
    <circle cx="48" cy="115" r="34" />
    <circle cx="38" cy="185" r="38" />
    <circle cx="46" cy="260" r="35" />
    <circle cx="39" cy="335" r="38" />
    <circle cx="47" cy="415" r="36" />
    <circle cx="40" cy="495" r="37" />
    <circle cx="45" cy="565" r="34" />
  </g>

  <!-- Layer 3: Solid White Cloud Puffs (Foreground layer) merging into the white card -->
  <g fill="#ffffff" filter="url(#cloudSoftShadow)">
    <rect x="65" y="0" width="35" height="600" />
    <circle cx="65" cy="25" r="32" />
    <circle cx="60" cy="85" r="35" />
    <circle cx="64" cy="150" r="33" />
    <circle cx="58" cy="215" r="36" />
    <circle cx="65" cy="280" r="34" />
    <circle cx="59" cy="345" r="37" />
    <circle cx="64" cy="410" r="33" />
    <circle cx="58" cy="475" r="36" />
    <circle cx="65" cy="540" r="34" />
    <circle cx="60" cy="595" r="32" />
  </g>
</svg>
