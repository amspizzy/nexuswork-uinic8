<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Circle Drop Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0245a3" flood-opacity="0.25" />
    </filter>
    
    <!-- Rocket Gradient -->
    <linearGradient id="rocketBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e80ff" />
      <stop offset="100%" stop-color="#0d63d8" />
    </linearGradient>
    <linearGradient id="rocketAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0052cc" />
      <stop offset="100%" stop-color="#0245a3" />
    </linearGradient>
  </defs>

  <!-- White Circle Container -->
  <circle cx="60" cy="60" r="50" fill="#ffffff" filter="url(#badgeShadow)" />

  <!-- Rocket Group tilted 45 deg -->
  <g transform="translate(60, 60) rotate(-45) translate(-60, -60)">
    
    <!-- Left Fin -->
    <path d="M 46 64 C 42 75 36 82 36 82 C 36 82 48 80 54 74 Z" fill="url(#rocketAccent)" />
    
    <!-- Right Fin -->
    <path d="M 74 64 C 78 75 84 82 84 82 C 84 82 72 80 66 74 Z" fill="url(#rocketAccent)" />

    <!-- Rocket Body -->
    <path d="M 60 26 C 68 38 72 54 72 72 C 60 76 60 76 48 72 C 48 54 52 38 60 26 Z" fill="url(#rocketBlue)" />

    <!-- Center Fin / Stripe -->
    <path d="M 58 60 L 62 60 L 62 76 L 58 76 Z" fill="url(#rocketAccent)" opacity="0.4" />

    <!-- Porthole Window Outer -->
    <circle cx="60" cy="46" r="6.5" fill="#ffffff" />
    <!-- Porthole Window Inner -->
    <circle cx="60" cy="46" r="4" fill="#0d63d8" />

    <!-- Thruster Flame -->
    <path d="M 55 74 Q 60 88 60 92 Q 60 88 65 74 Z" fill="#38bdf8" opacity="0.9" />
    <path d="M 57 74 Q 60 84 60 86 Q 60 84 63 74 Z" fill="#ffffff" />
  </g>
</svg>
