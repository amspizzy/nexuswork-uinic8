<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 90" preserveAspectRatio="none" width="100%" height="100%">
  <defs>
    <filter id="cloudHShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="-3" stdDeviation="5" flood-color="#0245a3" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Layer 1: Semi-transparent blue cloud puffs (Back) -->
  <g fill="rgba(255, 255, 255, 0.22)">
    <circle cx="35" cy="55" r="32" />
    <circle cx="95" cy="48" r="36" />
    <circle cx="160" cy="52" r="30" />
    <circle cx="225" cy="46" r="34" />
    <circle cx="295" cy="50" r="32" />
    <circle cx="365" cy="48" r="35" />
  </g>

  <!-- Layer 2: Medium opacity puffs (Middle) -->
  <g fill="rgba(255, 255, 255, 0.45)">
    <circle cx="45" cy="62" r="28" />
    <circle cx="110" cy="56" r="32" />
    <circle cx="180" cy="60" r="26" />
    <circle cx="250" cy="54" r="30" />
    <circle cx="320" cy="58" r="28" />
    <circle cx="380" cy="56" r="29" />
  </g>

  <!-- Layer 3: Solid White Cloud Puffs (Foreground) merging into bottom card -->
  <g fill="#ffffff" filter="url(#cloudHShadow)">
    <rect x="0" y="60" width="400" height="30" />
    <circle cx="20" cy="60" r="24" />
    <circle cx="65" cy="54" r="28" />
    <circle cx="120" cy="58" r="25" />
    <circle cx="175" cy="52" r="30" />
    <circle cx="230" cy="56" r="26" />
    <circle cx="285" cy="50" r="29" />
    <circle cx="340" cy="55" r="27" />
    <circle cx="385" cy="60" r="24" />
  </g>
</svg>
